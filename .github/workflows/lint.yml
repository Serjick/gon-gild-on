name: lint
on:
  push:
    branches:
      - main
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'tools/go.mod'
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version
    permissions:
      contents: read
